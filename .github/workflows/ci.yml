name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint:check
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx jest --ci --silent
      - run: npm run build
      - name: Services log through the Nest Logger (QA-04)
        run: '! grep -rn "console\." src --include=*.service.ts'

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      JWT_SECRET: ci-only-dummy-secret-0123456789abcdef0123456789abcdef
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # DESIGN-02 / DESIGN-04 / QA-04 are errors (see frontend/eslint-rules/no-raw-colors.mjs).
      # The ceiling is a ratchet, not a formality: the tree sits at 60 warnings
      # today, so 80 leaves headroom for a work-in-progress branch while still
      # failing on a slide. Phase 34 rewrites the storefront and lowers it again.
      - run: npx eslint . --max-warnings 80
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Motion allowlist (SPEC 6.4)
        run: |
          ! grep -rn "BlurFade\|MagicCard\|ShimmerButton\|ShineBorder\|PulsatingButton\|InteractiveHoverButton\|AnimatedList\|AvatarCircles\|AnimatedCircularProgressBar\|TextAnimate\|HyperText\|CoolMode" --include=*.tsx app components
      - name: Polling floor (SPEC 6.4 - no interval under 30s, no background polling)
        run: |
          ! grep -rnE "refetchInterval: *(1?[0-9]{1,4})(,|$)|refetchIntervalInBackground" --include=*.ts --include=*.tsx app components lib
      - name: One token file (SPEC 7 - no second :root palette)
        run: |
          ! grep -rl --include=*.css "^  --public-" app | grep -v "app/tokens.css"
